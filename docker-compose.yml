services:
  api:
    build:
      context: .
      target: runtime
    container_name: armforge-api
    restart: unless-stopped
    ports:
      - '${PORT:-8080}:8080'
    environment:
      NODE_ENV: production
      PORT: 8080
      HOST: 0.0.0.0
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/armforge?schema=public
      LOG_LEVEL: info
      LOG_PRETTY: 'false'
      SWAGGER_ENABLED: 'true'
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - armforge

  postgres:
    image: postgres:16
    container_name: armforge-postgres
    restart: unless-stopped
    ports:
      - '5432:5432'
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: armforge
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d armforge']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - armforge

volumes:
  postgres-data:

networks:
  armforge:
    driver: bridge
